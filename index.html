<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Obook</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial;
  background: #fff0f8;
}
header {
  background: #ff1493;
  color: white;
  padding: 20px;
  font-size: 30px;
  font-weight: bold;
}
nav {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 15px 2px;
}
nav span {
  color: #e60073;
  font-size: 13px;
}
.card {
  background: white;
  margin: 12px;
  padding: 18px;
  border-radius: 15px;
}
h2 {
  color: #ed1685;
}
</style>
</head>

<body>

<header>❤️ Obook</header>

<nav>
<span>Home</span>
<span>Friends</span>
<span>Reels</span>
<span>Groups</span>
<span>Profile</span>
</nav>

<div class="card">
<h2>Welcome to Obook ❤️</h2>
<p>Create • Share • Earn</p>
</div>

<div class="card">
<h2>What's on your mind?</h2>
<p>Share your photos and videos.</p>
</div>

<div class="card">
<h2>Creator Earnings</h2>
<p>Your earning dashboard</p>
</div>

</body>
</html>
